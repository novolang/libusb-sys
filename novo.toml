[package]
name        = "libusb-sys"
version     = "0.1.0"
description = "Bindings over libusb-1.0, the userspace USB library: the session, the device list and what a device reports about itself, the descriptors, the device handle with its configurations and interfaces, the three synchronous transfers and the error strings, one declaration per C entry point."
license     = "Apache-2.0"

# NOT a `0.0.x` draft.  An interface release is the shape whose every
# `pub fn` body is a `todo()`, and every `pub fn` here is an `@ffi`
# declaration with no body at all — `novo pkg publish` reads that as a
# release with bodies and refuses a `0.0.x` version for it.
stability   = "experimental"

# `sys`: the layer for a package that binds one C library and decides
# nothing of its own.  Every `pub fn` below is an `@ffi` declaration of
# a function in libusb-1.0.
layer       = "sys"

category    = "bindings"

# The one C library.  The stem the loader resolves is `libusb-1.0`, and
# the major version is part of it: `libusb-1.0.so.0` is the file, and a
# `libusb.so` on this machine would be the 0.1 library, which is a
# different interface with different symbols.
wraps       = "libusb-1.0"

tags        = ["ffi", "usb", "libusb", "device", "hardware", "bindings"]
repository  = "https://github.com/novolang/libusb-sys"
maintainers = ["novo-lang"]
novo        = ">= 0.8.9"

[docs.pages]
"README.md" = "The C entry points of libusb-1.0, one novo-lang declaration each"

[dependencies]
# None.  A binding over one C library depends on no novo-lang package.

# The link flag for the `library = "usb-1.0"` name every declaration in
# `src/` carries.  `libusb-1.0-0-dev` installs
# `/usr/lib/<arch>/pkgconfig/libusb-1.0.pc`, so pkg-config answers
# `-lusb-1.0` on Debian and Ubuntu.  Without the block the default is
# `-lusb-1.0`, which is the same flag on a system that put the library
# somewhere the linker already looks.
[ffi.usb-1.0]
pkg_config = "libusb-1.0"
